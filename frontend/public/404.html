<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Finance Tracker</title>
    <!-- GitHub Pages SPA redirect: forward any 404 back to index.html -->
    <script>
      // Store the path and redirect to the root, preserving the path in sessionStorage
      sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
      location.replace(location.origin + location.pathname.split('/').slice(0, 2).join('/') + '/');
    </script>
  </head>
  <body></body>
</html>
